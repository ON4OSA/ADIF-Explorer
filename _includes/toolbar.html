<div class="toolbar__section toolbar__section--left">
  <span class="toolbar__brand">{{ site.title }}</span>
</div>

<div class="toolbar__section toolbar__section--center">
  <div class="file-select">
    <input class="file-select__input"
           type="file"
           id="adif-file"
           name="adif-file"
           accept=".adi,.adif,text/plain">
    <label class="file-select__button" for="adif-file">
      <svg class="file-select__icon" viewBox="0 0 16 16" width="16" height="16"
           fill="none" stroke="currentColor" stroke-width="1.4"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.2 1.8H4.4a1.4 1.4 0 0 0-1.4 1.4v9.6a1.4 1.4 0 0 0 1.4 1.4h7.2a1.4 1.4 0 0 0 1.4-1.4V5.6z"/>
        <path d="M9.2 1.8v3.8H13"/>
      </svg>
      <span class="file-select__label" id="adif-file-name">Choose ADIF file</span>
    </label>
  </div>

  <button class="toolbar__button"
          id="show-table"
          type="button"
          disabled
          title="Show records as a table"
          aria-label="Show records as a table">
    <svg viewBox="0 0 16 16" width="16" height="16"
         fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.4"/>
      <path d="M1.8 6.2h12.4M6.4 6.2v7M1.8 9.7h12.4"/>
    </svg>
  </button>

  <button class="toolbar__button"
          id="show-charts"
          type="button"
          disabled
          title="Show breakdown charts"
          aria-label="Show breakdown charts">
    <svg viewBox="0 0 16 16" width="16" height="16"
         fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 1.8a6.2 6.2 0 1 0 6.2 6.2"/>
      <path d="M8 1.8V8h6.2A6.2 6.2 0 0 0 8 1.8z"/>
    </svg>
  </button>

  <button class="toolbar__button"
          id="show-timeline"
          type="button"
          disabled
          title="Show QSOs over time"
          aria-label="Show QSOs over time">
    <svg viewBox="0 0 16 16" width="16" height="16"
         fill="none" stroke="currentColor" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="8" cy="8" r="6.2"/>
      <path d="M8 4.4V8l2.6 1.6"/>
    </svg>
  </button>
</div>

<div class="toolbar__section toolbar__section--right"></div>
